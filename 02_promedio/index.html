<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promedio de notas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilos.css">
  <!-- defer ejecuta el archivo cuando el HTML ya se ha analizado. -->
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <a href="../index.html">Volver a los ejercicios</a>
    <p class="actividad">EJERCICIO 02</p>
    <h1>Promedio de notas</h1>
    <p class="descripcion">Ingresa tres notas de 0 a 10. El promedio se mostrará con dos decimales.</p>
    <form id="formulario" novalidate>
      <label for="nota1">Primera nota</label>
      <input id="nota1" name="nota1" type="number" min="0" max="10" step="any" required>
      <label for="nota2">Segunda nota</label>
      <input id="nota2" name="nota2" type="number" min="0" max="10" step="any" required>
      <label for="nota3">Tercera nota</label>
      <input id="nota3" name="nota3" type="number" min="0" max="10" step="any" required>
      <div class="acciones">
        <button type="submit">Calcular</button>
        <button type="reset">Limpiar</button>
      </div>
    </form>
    <p id="error" class="error" role="alert"></p>
    <section class="resultado" aria-labelledby="titulo-resultado" aria-live="polite">
      <h2 id="titulo-resultado">Resultado</h2>
      <div id="resultado">
        <p>Promedio: <strong id="salida-promedio">—</strong></p>
      </div>
    </section>
    <p class="nota">Promedio = (primera nota + segunda nota + tercera nota) / 3.</p>
  </main>
</body>
</html>
